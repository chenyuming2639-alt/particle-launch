<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030711">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Opening">
<title>AI Particle Opening · V2</title>
<style>
:root{color-scheme:dark;--ice:#dff8ff;--cyan:#61d8ff;--blue:#4a8dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
#stage{position:relative;width:100vw;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#0b1d34 0%,#071020 35%,#030711 72%,#02040a 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 24%,rgba(0,0,0,.42) 100%)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);transform:translateY(-1.5vh);pointer-events:none}
.mark{width:min(42vw,166px);aspect-ratio:1;position:relative;opacity:0;transform:scale(.84);filter:drop-shadow(0 0 24px rgba(72,180,255,.18))}
.mark svg{width:100%;height:100%;overflow:visible}.orbit{fill:none;stroke:url(#lineGrad);stroke-width:1.1;opacity:.9}.orbit.thin{stroke-width:.6;opacity:.55}.node{fill:#dffaff;filter:drop-shadow(0 0 4px #61d8ff)}.core{fill:url(#sphere);stroke:rgba(225,249,255,.8);stroke-width:.8}
.name{margin-top:27px;color:#f4fbff;font-size:clamp(29px,7.7vw,37px);font-weight:570;letter-spacing:-1.2px;opacity:0;transform:translateY(8px);text-shadow:0 0 28px rgba(92,197,255,.13)}
.tagline{margin-top:12px;color:rgba(165,205,232,.48);font-size:9px;letter-spacing:3.6px;opacity:0;transform:translateY(5px)}
#replay{position:absolute;right:17px;top:calc(env(safe-area-inset-top) + 15px);padding:10px 13px;border:1px solid rgba(155,213,246,.2);border-radius:99px;background:rgba(10,22,39,.5);color:rgba(226,244,255,.72);font-size:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;pointer-events:auto}
@keyframes appear{to{opacity:1;transform:scale(1)}}@keyframes textIn{to{opacity:1;transform:translateY(0)}}@keyframes orbitSpin{to{transform:rotate(360deg)}}.in-mark{animation:appear .72s cubic-bezier(.16,.84,.24,1) forwards}.in-name{animation:textIn .55s ease-out forwards}.in-tag{animation:textIn .6s ease-out forwards}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="stage" aria-label="科技粒子启动动画">
<canvas id="particles"></canvas><div class="vignette"></div>
<div class="center">
  <div class="mark" id="mark" aria-hidden="true">
    <svg viewBox="0 0 120 120" role="presentation">
      <defs>
        <radialGradient id="sphere"><stop offset="0" stop-color="#e9fcff" stop-opacity=".9"/><stop offset=".36" stop-color="#66d5ff" stop-opacity=".3"/><stop offset="1" stop-color="#2d7cff" stop-opacity=".015"/></radialGradient>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8f8ff"/><stop offset=".52" stop-color="#59caff"/><stop offset="1" stop-color="#738dff"/></linearGradient>
      </defs>
      <circle class="core" cx="60" cy="60" r="27"/>
      <ellipse class="orbit" cx="60" cy="60" rx="44" ry="18" transform="rotate(-34 60 60)"/>
      <ellipse class="orbit" cx="60" cy="60" rx="44" ry="18" transform="rotate(34 60 60)"/>
      <ellipse class="orbit thin" cx="60" cy="60" rx="34" ry="47" transform="rotate(19 60 60)"/>
      <circle class="node" cx="99" cy="34" r="2.1"/><circle class="node" cx="20" cy="72" r="1.7"/><circle class="node" cx="70" cy="14" r="1.5"/>
    </svg>
  </div>
  <div class="name" id="name">ChatGPT</div>
  <div class="tagline" id="tagline">INTELLIGENCE IN MOTION</div>
</div>
<button id="replay" type="button">↻ 重播动画</button>
</main>
<script>
(()=>{
const canvas=document.querySelector('#particles'),ctx=canvas.getContext('2d',{alpha:true});
const mark=document.querySelector('#mark'),name=document.querySelector('#name'),tagline=document.querySelector('#tagline'),replay=document.querySelector('#replay');
let W=0,H=0,D=1,particles=[],stars=[],raf=0,start=0,revealed=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)};
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);seed()}
function seed(){particles=[];stars=[];let n=Math.min(380,Math.max(210,Math.floor(W*H/2500)));for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,r=rand(Math.min(W,H)*.18,Math.max(W,H)*.68);particles.push({x:W/2+Math.cos(a)*r,y:H*.455+Math.sin(a)*r,a,r,phase:rand(0,6.28),size:rand(.55,1.6),tone:Math.random(),speed:rand(.65,1.25)})}for(let i=0;i<75;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.25,.9),p:rand(0,6.28)})}
function frame(t){let s=(t-start)/1000,p=clamp(s/2.5),g=ease((p-.04)/.64),cx=W/2,cy=H*.455;ctx.clearRect(0,0,W,H);
let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.48);glow.addColorStop(0,`rgba(43,125,197,${.07+.035*Math.sin(t*.001)})`);glow.addColorStop(.45,'rgba(18,65,118,.035)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
for(const st of stars){ctx.beginPath();ctx.fillStyle=`rgba(131,194,235,${.1+.18*(.5+.5*Math.sin(t*.0007+st.p))})`;ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill()}
for(const q of particles){let ang=q.a+t*.00012*q.speed;let targetR=(Math.min(W,H)*(.018+.16*(1-g)))+Math.sin(t*.001+q.phase)*5*(1-g);let tx=cx+Math.cos(ang)*targetR,ty=cy+Math.sin(ang)*targetR*1.12;let pull=.012+g*.24;q.x+=(tx-q.x)*pull;q.y+=(ty-q.y)*pull;let a=(.12+.78*g)*(.68+.32*Math.sin(t*.0026+q.phase));ctx.beginPath();ctx.fillStyle=q.tone>.87?`rgba(226,250,255,${a})`:`rgba(77,190,255,${a})`;ctx.shadowBlur=2+g*8;ctx.shadowColor='#61d8ff';ctx.arc(q.x,q.y,q.size*(.7+g*.45),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(g>.25&&q.tone>.975){ctx.beginPath();ctx.strokeStyle=`rgba(139,224,255,${.2*g})`;ctx.lineWidth=.6;ctx.moveTo(q.x,q.y);ctx.lineTo(q.x+(cx-q.x)*.04,q.y+(cy-q.y)*.04);ctx.stroke()}}
if(p>.62&&!revealed){revealed=true;mark.classList.add('in-mark');setTimeout(()=>{name.classList.add('in-name');tagline.classList.add('in-tag');replay.style.opacity='1'},260)}
if(s<4.2)raf=requestAnimationFrame(frame)}
function play(){cancelAnimationFrame(raf);revealed=false;start=performance.now();for(const el of [mark,name,tagline]){el.classList.remove('in-mark','in-name','in-tag');el.style.opacity='0';el.style.transform=el===mark?'scale(.84)':'translateY(8px)'}replay.style.opacity='0';seed();raf=requestAnimationFrame(frame)}
addEventListener('resize',resize,{passive:true});replay.addEventListener('click',play);document.querySelector('#stage').addEventListener('click',e=>{if(e.target!==replay&&revealed)play()});resize();play();
})();
</script>
</body>
</html>
