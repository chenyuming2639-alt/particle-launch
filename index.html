<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="粒子启动">
<title>ChatGPT 风格 · 粒子启动</title>
<style>
:root{color-scheme:dark;--bg:#050912;--cyan:#55c8ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
body{min-height:100svh}
#stage{position:relative;width:100vw;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#0b1b30 0%,#07101d 33%,#050912 68%,#03060b 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.25) 100%)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);pointer-events:none}
.logo-wrap{position:relative;width:min(44vw,190px);aspect-ratio:1;display:grid;place-items:center;opacity:0;transform:scale(.82);filter:drop-shadow(0 0 18px rgba(85,200,255,.4));}
.logo-wrap svg{width:100%;height:100%;overflow:visible}
.logo-stroke{fill:none;stroke:#effaff;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.wordmark{margin-top:20px;font-size:clamp(25px,7vw,34px);font-weight:550;letter-spacing:-.8px;color:#f3f9ff;opacity:0;transform:translateY(8px);text-shadow:0 0 24px rgba(85,200,255,.22)}
.tagline{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 42px);font-size:11px;letter-spacing:2.6px;color:rgba(177,208,235,.42);opacity:0;transition:opacity .5s}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 17px);font-size:11px;color:rgba(177,208,235,.45);letter-spacing:.3px;opacity:0;transition:opacity .5s}
#replay{position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 14px);border:1px solid rgba(160,210,245,.18);background:rgba(12,25,42,.5);color:rgba(225,242,255,.75);border-radius:99px;padding:9px 12px;font-size:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:auto}
#replay:active{transform:scale(.97)}
@keyframes logoIn{to{opacity:1;transform:scale(1)}}
@keyframes wordIn{to{opacity:1;transform:translateY(0)}}
@keyframes haloPulse{0%,100%{filter:drop-shadow(0 0 12px rgba(85,200,255,.28))}50%{filter:drop-shadow(0 0 25px rgba(85,200,255,.5))}}
.show-logo{animation:logoIn .55s cubic-bezier(.16,.8,.25,1) forwards,haloPulse 2.6s ease-in-out .55s infinite}
.show-word{animation:wordIn .45s ease-out forwards}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="stage" aria-label="科技粒子启动动画">
  <canvas id="particles"></canvas>
  <div class="vignette"></div>
  <div class="content">
    <div class="logo-wrap" id="logo" aria-hidden="true">
      <!-- Original interwoven-knot-inspired mark, not an exact official logo reproduction -->
      <svg viewBox="0 0 120 120">
        <path class="logo-stroke" d="M60 15 C72 15 80 23 80 34 L80 43 C91 38 103 45 106 56 C109 67 102 76 92 81 L84 85 C87 98 78 107 67 107 C56 107 49 100 45 91 L40 82 C30 91 17 86 13 76 C9 65 15 55 25 50 L34 46 C29 34 37 23 48 20 C54 18 58 20 64 24"/>
        <path class="logo-stroke" d="M60 15 C49 15 42 23 42 34 L42 44 C42 50 46 55 52 58 L68 67 C75 71 78 77 78 85 L78 88"/>
        <path class="logo-stroke" d="M106 56 C101 47 91 45 82 50 L73 55 C67 58 65 64 66 70 L69 88 C70 96 66 102 59 105"/>
        <path class="logo-stroke" d="M13 76 C18 85 28 87 37 82 L46 77 C52 74 55 68 53 62 L48 45 C46 37 49 30 56 26"/>
      </svg>
    </div>
    <div class="wordmark" id="wordmark">ChatGPT</div>
    <div class="tagline" id="tagline">INTELLIGENCE IN MOTION</div>
    <div class="hint" id="hint">轻触屏幕可重新播放</div>
  </div>
  <button id="replay" type="button">↻ 重播动画</button>
</main>
<script>
(()=>{
 const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d',{alpha:true});
 const logo=document.getElementById('logo'),word=document.getElementById('wordmark');
 const tagline=document.getElementById('tagline'),hint=document.getElementById('hint'),replay=document.getElementById('replay');
 let W=0,H=0,DPR=1,particles=[],start=performance.now(),raf=0,finished=false;
 const rand=(a,b)=>a+Math.random()*(b-a);
 function resize(){
   W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
   canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
   ctx.setTransform(DPR,0,0,DPR,0,0);makeParticles();
 }
 function knotPoint(t){
   // Three looping curves create an abstract, interwoven knot silhouette.
   const cx=W*.5, cy=H*.455, s=Math.min(W*.255,104);
   const r=s*(.64+.13*Math.sin(3*t));
   const a=t*2;
   return {x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r*.95};
 }
 function makeParticles(){
   particles=[];
   const count=Math.min(450,Math.max(220,Math.floor(W*H/2600)));
   for(let i=0;i<count;i++){
     const t=Math.random()*Math.PI*2, target=knotPoint(t);
     particles.push({x:rand(0,W),y:rand(0,H),vx:rand(-.3,.3),vy:rand(-.3,.3),
       tx:target.x+rand(-3,3),ty:target.y+rand(-3,3),size:rand(.55,1.65),
       phase:Math.random()*Math.PI*2,delay:Math.random()*.42,bright:Math.random()});
   }
   // A halo of drifting stars around the logo
   for(let i=0;i<90;i++)particles.push({x:rand(0,W),y:rand(0,H),vx:rand(-.12,.12),vy:rand(-.12,.12),tx:rand(0,W),ty:rand(0,H),size:rand(.3,1),phase:rand(0,6.28),delay:rand(0,.8),bright:.2,star:true});
 }
 function ease(x){return x<0?0:x>1?1:x*x*(3-2*x)}
 function draw(now){
   const elapsed=(now-start)/1000, t=Math.min(elapsed/2.35,1);
   ctx.clearRect(0,0,W,H);
   // soft central light
   const glow=ctx.createRadialGradient(W*.5,H*.46,2,W*.5,H*.46,Math.min(W,H)*.42);
   glow.addColorStop(0,`rgba(30,115,190,${.045+.04*Math.sin(now*.0015)})`);glow.addColorStop(1,'rgba(0,0,0,0)');
   ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
   const gather=ease((t-.08)/.62);
   for(const p of particles){
     if(p.star){
       p.x+=p.vx;p.y+=p.vy;
       if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
       const alpha=.12+.32*(.5+.5*Math.sin(now*.001+p.phase));
       ctx.beginPath();ctx.fillStyle=`rgba(104,194,255,${alpha})`;ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();continue;
     }
     const local=ease((t-p.delay*.4)/.7);
     const angle=(1-local)*Math.sin(now*.00045+p.phase)*.65;
     const dx=p.tx-W*.5,dy=p.ty-H*.455;
     const rx=dx*Math.cos(angle)-dy*Math.sin(angle),ry=dx*Math.sin(angle)+dy*Math.cos(angle);
     const tx=W*.5+rx,ty=H*.455+ry;
     const drift=1-gather;
     const swirlX=Math.cos(p.phase+now*.0007)*Math.min(W,H)*.18*drift;
     const swirlY=Math.sin(p.phase+now*.0007)*Math.min(W,H)*.18*drift;
     const x=p.x+(tx+swirlX-p.x)*(.025+local*.17);
     const y=p.y+(ty+swirlY-p.y)*(.025+local*.17);
     p.x=x;p.y=y;
     const alpha=.18+.82*local;
     const radius=p.size*(.65+local*.6);
     ctx.beginPath();ctx.fillStyle=`rgba(${p.bright>.7?'220,248,255':'76,190,255'},${alpha})`;ctx.shadowBlur=local*9;ctx.shadowColor='#55c8ff';ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
     if(p.bright>.91&&local>.25){ctx.beginPath();ctx.strokeStyle=`rgba(105,205,255,${.15*local})`;ctx.lineWidth=.6;ctx.moveTo(x,y);ctx.lineTo(x+(W*.5-x)*.04,y+(H*.455-y)*.04);ctx.stroke();}
   }
   if(t>.64&&!finished){
     finished=true;logo.classList.add('show-logo');
     setTimeout(()=>{word.classList.add('show-word');tagline.style.opacity='.8';hint.style.opacity='.75';replay.style.opacity='1'},320);
   }
   if(t<1.15)raf=requestAnimationFrame(draw);
 }
 function play(){
   cancelAnimationFrame(raf);finished=false;start=performance.now();
   logo.classList.remove('show-logo');word.classList.remove('show-word');
   logo.style.opacity='0';logo.style.transform='scale(.82)';word.style.opacity='0';word.style.transform='translateY(8px)';
   tagline.style.opacity='0';hint.style.opacity='0';replay.style.opacity='0';
   makeParticles();raf=requestAnimationFrame(draw);
 }
 addEventListener('resize',resize,{passive:true});
 replay.addEventListener('click',play);
 document.getElementById('stage').addEventListener('click',e=>{if(e.target!==replay&&finished)play()});
 resize();play();
})();
</script>
</body>
</html>
