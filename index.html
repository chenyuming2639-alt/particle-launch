<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030711">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Splash">
<title>AI · Particle Opening</title>
<style>
:root{color-scheme:dark;--bg:#030711;--ice:#b9edff;--blue:#55caff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
body{min-height:100svh}#stage{position:relative;width:100vw;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0a1b31 0%,#060d1a 35%,#030711 72%,#02040a 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 28%,rgba(0,0,0,.36) 100%)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);pointer-events:none;transform:translateY(-1.5vh)}
.emblem{position:relative;width:min(39vw,156px);aspect-ratio:1;display:grid;place-items:center;opacity:0;transform:scale(.72);filter:drop-shadow(0 0 26px rgba(79,193,255,.3))}
.emblem svg{width:100%;height:100%;overflow:visible}.orbit{fill:none;stroke:rgba(142,224,255,.8);stroke-width:1.1}.core{fill:url(#coreGrad);stroke:rgba(219,248,255,.92);stroke-width:1.3}.spark{fill:#dff9ff;filter:drop-shadow(0 0 5px #68d6ff)}
.wordmark{margin-top:27px;font-size:clamp(27px,7.5vw,36px);font-weight:570;letter-spacing:-1px;color:#f4fbff;opacity:0;transform:translateY(10px);text-shadow:0 0 28px rgba(89,197,255,.16)}
.sub{margin-top:10px;font-size:10px;letter-spacing:3.4px;color:rgba(170,211,239,.55);opacity:0;transform:translateY(6px)}
#replay{position:absolute;right:17px;top:calc(env(safe-area-inset-top) + 15px);border:1px solid rgba(155,213,246,.2);background:rgba(10,22,39,.56);color:rgba(226,244,255,.76);border-radius:99px;padding:10px 13px;font-size:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;pointer-events:auto}
#replay:active{transform:scale(.97)}@keyframes rise{to{opacity:1;transform:scale(1)}}@keyframes wordRise{to{opacity:1;transform:translateY(0)}}@keyframes ringTurn{to{transform:rotate(360deg)}}.show-emblem{animation:rise .62s cubic-bezier(.16,.84,.24,1) forwards}.show-word{animation:wordRise .5s ease-out forwards}.show-sub{animation:wordRise .6s ease-out forwards}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="stage" aria-label="科技粒子启动动画">
<canvas id="particles"></canvas><div class="shade"></div>
<div class="content">
  <div class="emblem" id="emblem" aria-hidden="true">
    <svg viewBox="0 0 120 120" role="presentation">
      <defs><radialGradient id="coreGrad"><stop offset="0" stop-color="#d9f8ff" stop-opacity=".95"/><stop offset=".42" stop-color="#6ed4ff" stop-opacity=".28"/><stop offset="1" stop-color="#48aaff" stop-opacity=".02"/></radialGradient></defs>
      <circle class="core" cx="60" cy="60" r="26"/>
      <ellipse class="orbit" cx="60" cy="60" rx="43" ry="17" transform="rotate(-34 60 60)"/>
      <ellipse class="orbit" cx="60" cy="60" rx="43" ry="17" transform="rotate(34 60 60)" opacity=".55"/>
      <circle class="spark" cx="99" cy="36" r="2.2"/><circle class="spark" cx="22" cy="72" r="1.7"/><circle class="spark" cx="70" cy="17" r="1.5"/>
    </svg>
  </div>
  <div class="wordmark" id="wordmark">ChatGPT</div>
  <div class="sub" id="sub">INTELLIGENCE IN MOTION</div>
</div>
<button id="replay" type="button">↻ 重播动画</button>
</main>
<script>
(()=>{
const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d',{alpha:true});
const emblem=document.getElementById('emblem'),word=document.getElementById('wordmark'),sub=document.getElementById('sub'),replay=document.getElementById('replay');
let W=0,H=0,DPR=1,stars=[],dust=[],start=0,raf=0,shown=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)};
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);makeDust()}
function makeDust(){dust=[];stars=[];let n=Math.min(420,Math.max(230,Math.floor(W*H/2300)));for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,r=rand(Math.min(W,H)*.12,Math.max(W,H)*.72);dust.push({x:W/2+Math.cos(a)*r,y:H*.455+Math.sin(a)*r,vx:rand(-.25,.25),vy:rand(-.25,.25),a,size:rand(.5,1.65),delay:Math.random()*.48,seed:Math.random()*6.28,bright:Math.random()})}for(let i=0;i<95;i++)stars.push({x:rand(0,W),y:rand(0,H),r:rand(.25,1),p:rand(0,6.28),v:rand(.03,.14)})}
function draw(now){let elapsed=(now-start)/1000,progress=clamp(elapsed/2.5),gather=ease((progress-.04)/.62),cx=W*.5,cy=H*.455;ctx.clearRect(0,0,W,H);
let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.42);glow.addColorStop(0,`rgba(38,126,197,${.04+.055*Math.sin(now*.0012)})`);glow.addColorStop(.5,'rgba(14,64,112,.035)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
for(const s of stars){let a=.12+.25*(.5+.5*Math.sin(now*.001*s.v*8+s.p));ctx.beginPath();ctx.fillStyle=`rgba(126,198,237,${a})`;ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
for(const p of dust){let swirl=1-gather,angle=p.a+now*.00018*(p.bright>.5?1:-1),radius=(Math.min(W,H)*(.035+.18*(1-gather)))+(1-gather)*Math.sin(now*.001+p.seed)*8;let tx=cx+Math.cos(angle)*radius,ty=cy+Math.sin(angle)*radius*1.08;let x=p.x+(tx-p.x)*(.018+gather*.20),y=p.y+(ty-p.y)*(.018+gather*.20);p.x=x;p.y=y;let alpha=(.1+.8*gather)*(.65+.35*Math.sin(now*.003+p.seed));ctx.beginPath();ctx.fillStyle=p.bright>.83?`rgba(228,250,255,${alpha})`:`rgba(76,190,255,${alpha})`;ctx.shadowBlur=2+gather*10;ctx.shadowColor='#63cfff';ctx.arc(x,y,p.size*(.65+gather*.65),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
if(gather>.22&&p.bright>.96){ctx.beginPath();ctx.strokeStyle=`rgba(133,222,255,${.16*gather})`;ctx.lineWidth=.6;ctx.moveTo(x,y);ctx.lineTo(x+(cx-x)*.045,y+(cy-y)*.045);ctx.stroke()}}
if(progress>.64&&!shown){shown=true;emblem.classList.add('show-emblem');setTimeout(()=>{word.classList.add('show-word');sub.classList.add('show-sub');replay.style.opacity='1'},270)}
if(progress<1.08)raf=requestAnimationFrame(draw)}
function play(){cancelAnimationFrame(raf);shown=false;start=performance.now();emblem.classList.remove('show-emblem');word.classList.remove('show-word');sub.classList.remove('show-sub');emblem.style.opacity='0';emblem.style.transform='scale(.72)';word.style.opacity='0';word.style.transform='translateY(10px)';sub.style.opacity='0';sub.style.transform='translateY(6px)';replay.style.opacity='0';makeDust();raf=requestAnimationFrame(draw)}
addEventListener('resize',resize,{passive:true});replay.addEventListener('click',play);document.getElementById('stage').addEventListener('click',e=>{if(e.target!==replay&&shown)play()});resize();play();
})();
</script>
</body>
</html>
